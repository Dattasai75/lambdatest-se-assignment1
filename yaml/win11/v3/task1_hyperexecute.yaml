version: 0.1
runson: win11

autosplit: true
concurrency: 1

runtime:
  language: java
  version: "11"

env:
  TOKEN: "anvdegtod-asdaasda0asda-asda"

pre:
  - mvn dependency:resolve

testDiscovery:
  type: raw
  mode: static
  command: powershell -Command "Select-String -Path xml\testng_win11.xml -Pattern 'test name=\"([^\"]+)\"' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }"

testRunnerCommand: mvn test -Dplatname=win -Dmaven.repo.local=./.m2 dependency:resolve -DselectedTests=$test

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, win, v1, autosplit]
