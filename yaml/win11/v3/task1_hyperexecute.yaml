version: 0.1
runson: win11

autosplit: true
concurrency: 1

runtime:
  language: java
  version: "11"

env:
  TOKEN: "anvdegtod-asdaasda0asda-asda"

pre:
  - mvn dependency:resolve

testDiscovery:
  type: raw
  mode: static
  command: grep 'test name' xml/testng_win11.xml | awk '{print$2}' | sed 's/name=//g' | sed 's/>//g'

testRunnerCommand: mvn test -Dplatname=win -Dmaven.repo.local=./.m2 dependency:resolve -DselectedTests=$test

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, win11, v1, autosplit]
